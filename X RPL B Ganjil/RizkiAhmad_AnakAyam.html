    <script>

            AayamRizkiA=document.getElementById("AayamRizkiA").value
            for(BayamRizkiA = AayamRizkiA; BayamRizkiA>1;BayamRizkiA--){
                document.write("tekotek kotek kotek anak 🐤 turunlah " + BayamRizkiA + "<br>" + "tekotek kotek kotek mati satu tinggalah " + (BayamRizkiA-1)  + "<br>" + "<br>")
            }
            document.write("tekotek kotek kotek anak 🐤 turunlah 1 <br> tekotek kotek kotek mati satu sisa induknya")
        }
    </script>
