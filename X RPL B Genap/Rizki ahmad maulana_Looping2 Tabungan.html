<!DOCTYPE html>
<html>
    <script>
        Rizkitabung = 0
        Rizkiperminggu = 0
        while (Rizkitabung<1200000){
            Rizkitabung+=120000
            Rizkiperminggu++
            document.write ("minggu ke-" + Rizkiperminggu + ": ")
            document.write("Tabungan Rani Rp" + Rizkitabung + "<br>")                                                                                  
        }
        document.write("<br>")
        document.write("Rani memerlukan " + Rizkiperminggu + " minggu untuk membeli sepatu seharga Rp" + Rizkitabung )
    </script>
</html>
