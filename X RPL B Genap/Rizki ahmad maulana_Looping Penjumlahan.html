<!DOCTYPE html>
<html>
    <script>
        var Xrizkia = 1
        var rizkiaplus = 0
        while (Xrizkia <=20) {
            Xrizkia++
            if (Xrizkia%2==0){
            document.write(Xrizkia + " ")
            rizkiaplus=rizkiaplus+Xrizkia
            }
        }
        document.write("<br>")
        document.write("Total Jumlah Dari Bilangan Genap : " + rizkiaplus) 
    </script>
</html>
